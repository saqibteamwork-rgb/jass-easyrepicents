<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F070C"/>
      <stop offset="60%" stop-color="#120407"/>
      <stop offset="100%" stop-color="#080204"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="40%" stop-color="#84142D"/>
      <stop offset="80%" stop-color="#00A859"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E1B38"/>
      <stop offset="100%" stop-color="#6B0B20"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Dark Luxury Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  
  <!-- Glowing Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#ringGrad)" stroke-width="5" opacity="0.75"/>

  <!-- Subtle ambient glow circle behind receipt -->
  <circle cx="256" cy="235" r="150" fill="#84142D" opacity="0.18" filter="blur(30px)"/>
  
  <!-- Central Receipt Document with Thermal Perforated Edge -->
  <g filter="url(#cardShadow)">
    <path d="M 146 80 L 366 80 Q 378 80 378 92 L 378 365 L 358 350 L 338 365 L 318 350 L 298 365 L 278 350 L 258 365 L 238 350 L 218 365 L 198 350 L 178 365 L 158 350 L 134 365 L 134 92 Q 134 80 146 80 Z" fill="#FFFFFF"/>
    
    <!-- Header Bar -->
    <path d="M 134 92 Q 134 80 146 80 L 366 80 Q 378 80 378 92 L 378 152 L 134 152 Z" fill="url(#headerGrad)"/>
    
    <!-- Verified Badge in Header -->
    <circle cx="256" cy="116" r="20" fill="#00A859" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 248 116 L 254 122 L 265 110" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Receipt Amount -->
    <text x="256" y="200" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#1E1B1C" text-anchor="middle" letter-spacing="-0.5">Rs. 5,000</text>
    
    <!-- Success Status Pill -->
    <rect x="206" y="214" width="100" height="22" rx="11" fill="#E8F8EE" stroke="#00A859" stroke-width="1" stroke-opacity="0.4"/>
    <text x="256" y="229" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#00A859" text-anchor="middle" letter-spacing="1">PAID • VERIFIED</text>
    
    <!-- Divider -->
    <line x1="160" y1="250" x2="352" y2="250" stroke="#EAE2E3" stroke-width="2" stroke-dasharray="5,4"/>
    
    <!-- Transaction Meta Lines -->
    <rect x="160" y="265" width="80" height="7" rx="3.5" fill="#C7B8BA"/>
    <rect x="272" y="265" width="80" height="7" rx="3.5" fill="#84142D" opacity="0.8"/>
    
    <rect x="160" y="282" width="105" height="7" rx="3.5" fill="#DDD2D4"/>
    <rect x="297" y="282" width="55" height="7" rx="3.5" fill="#C7B8BA"/>

    <rect x="160" y="299" width="60" height="7" rx="3.5" fill="#DDD2D4"/>
    <rect x="252" y="299" width="100" height="7" rx="3.5" fill="#C7B8BA"/>
    
    <!-- Barcode at bottom -->
    <line x1="172" y1="320" x2="172" y2="336" stroke="#1E1B1C" stroke-width="3"/>
    <line x1="180" y1="320" x2="180" y2="336" stroke="#1E1B1C" stroke-width="1.5"/>
    <line x1="186" y1="320" x2="186" y2="336" stroke="#1E1B1C" stroke-width="4"/>
    <line x1="195" y1="320" x2="195" y2="336" stroke="#1E1B1C" stroke-width="2"/>
    <line x1="202" y1="320" x2="202" y2="336" stroke="#1E1B1C" stroke-width="3.5"/>
    <line x1="211" y1="320" x2="211" y2="336" stroke="#1E1B1C" stroke-width="2"/>
    <line x1="218" y1="320" x2="218" y2="336" stroke="#1E1B1C" stroke-width="5"/>
    <line x1="229" y1="320" x2="229" y2="336" stroke="#1E1B1C" stroke-width="1.5"/>
    <line x1="236" y1="320" x2="236" y2="336" stroke="#1E1B1C" stroke-width="3"/>
    <line x1="244" y1="320" x2="244" y2="336" stroke="#1E1B1C" stroke-width="2"/>
    <line x1="252" y1="320" x2="252" y2="336" stroke="#1E1B1C" stroke-width="4"/>
    <line x1="262" y1="320" x2="262" y2="336" stroke="#1E1B1C" stroke-width="2"/>
    <line x1="270" y1="320" x2="270" y2="336" stroke="#1E1B1C" stroke-width="3.5"/>
    <line x1="279" y1="320" x2="279" y2="336" stroke="#1E1B1C" stroke-width="1.5"/>
    <line x1="286" y1="320" x2="286" y2="336" stroke="#1E1B1C" stroke-width="4.5"/>
    <line x1="296" y1="320" x2="296" y2="336" stroke="#1E1B1C" stroke-width="2"/>
    <line x1="303" y1="320" x2="303" y2="336" stroke="#1E1B1C" stroke-width="3"/>
    <line x1="311" y1="320" x2="311" y2="336" stroke="#1E1B1C" stroke-width="2"/>
    <line x1="319" y1="320" x2="319" y2="336" stroke="#1E1B1C" stroke-width="4"/>
    <line x1="329" y1="320" x2="329" y2="336" stroke="#1E1B1C" stroke-width="2"/>
    <line x1="337" y1="320" x2="337" y2="336" stroke="#1E1B1C" stroke-width="3"/>
  </g>
  
  <!-- Bottom Brand Pill: RECEIPTS -->
  <rect x="146" y="415" width="220" height="52" rx="26" fill="#84142D" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3"/>
  <text x="256" y="449" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">RECEIPTS</text>
</svg>